version: 2.1

parameters:
  bridge_dispatch:
    type: boolean
    default: false
  bridge_op:
    type: string
    default: "DENY"
  task_id:
    type: string
    default: ""
  baidu_job_id:
    type: string
    default: ""
  bridge_ticket:
    type: string
    default: ""
  sdk_version:
    type: string
    default: "0.3.8"

jobs:
  baidu-cli-bridge:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install selected official AI Studio SDK
          command: python -m pip install --disable-pip-version-check --no-input "aistudio-sdk==<< pipeline.parameters.sdk_version >>"
      - run:
          name: Validate Baidu submit confirmation
          command: |
            if [ "<< pipeline.parameters.bridge_op >>" != "SDK_SELFTEST" ]; then
              python bridge/baidu/bridge.py --selftest-parser
            fi
      - run:
          name: Validate AI Studio job-id parser
          command: |
            if [ "<< pipeline.parameters.bridge_op >>" != "SDK_SELFTEST" ]; then
              python bridge/baidu/bridge_entry2.py --selftest-parser
            fi
      - run:
          name: Validate Baidu status/output diagnostic
          command: |
            if [ "<< pipeline.parameters.bridge_op >>" != "SDK_SELFTEST" ]; then
              python bridge/baidu/bridge_entry4.py --selftest-diagnostic
            fi
      - run:
          name: Validate Baidu structured runtime result
          command: |
            if [ "<< pipeline.parameters.bridge_op >>" != "SDK_SELFTEST" ]; then
              python bridge/baidu/job/run.py --selftest
            fi
      - run:
          name: Validate Baidu absolute startup command
          command: |
            if [ "<< pipeline.parameters.bridge_op >>" != "SDK_SELFTEST" ]; then
              python bridge/baidu/bridge_entry9.py --selftest-startup
            fi
      - run:
          name: Run bounded Baidu bridge operation
          when: always
          no_output_timeout: 2m
          environment:
            BRIDGE_OP: << pipeline.parameters.bridge_op >>
            BRIDGE_TASK_ID: << pipeline.parameters.task_id >>
            BRIDGE_BAIDU_JOB_ID: << pipeline.parameters.baidu_job_id >>
            BRIDGE_TICKET: << pipeline.parameters.bridge_ticket >>
          command: |
            if [ "<< pipeline.parameters.bridge_op >>" = "SDK_SELFTEST" ]; then
              SDK_SELFTEST_CALLBACK_PATH="/__callback/baidu-sdk039-c-20260816-b6c4e1f2a7935d08472e61c9bd563e1094f7a2c81d6e35b9f0248a7c53d18e60" python bridge/baidu/sdk_selftest.py
            else
              python bridge/baidu/bridge_entry9.py
            fi

workflows:
  baidu-cli-bridge:
    when: << pipeline.parameters.bridge_dispatch >>
    jobs:
      - baidu-cli-bridge
