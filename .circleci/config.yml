version: 2.1

parameters:
  bridge_dispatch:
    type: boolean
    default: false
  bridge_op:
    type: string
    default: "DENY"
  task_id:
    type: string
    default: ""
  baidu_job_id:
    type: string
    default: ""
  bridge_ticket:
    type: string
    default: ""

jobs:
  baidu-cli-bridge:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install pinned official AI Studio SDK
          command: python -m pip install --disable-pip-version-check --no-input "aistudio-sdk==0.3.8"
      - run:
          name: Validate AI Studio job-id parser
          command: python bridge/baidu/bridge_entry.py --selftest-parser
      - run:
          name: Run bounded Baidu CLI bridge
          when: always
          no_output_timeout: 10m
          environment:
            BRIDGE_OP: << pipeline.parameters.bridge_op >>
            BRIDGE_TASK_ID: << pipeline.parameters.task_id >>
            BRIDGE_BAIDU_JOB_ID: << pipeline.parameters.baidu_job_id >>
            BRIDGE_TICKET: << pipeline.parameters.bridge_ticket >>
          command: python bridge/baidu/bridge_entry.py

workflows:
  baidu-cli-bridge:
    when: << pipeline.parameters.bridge_dispatch >>
    jobs:
      - baidu-cli-bridge
